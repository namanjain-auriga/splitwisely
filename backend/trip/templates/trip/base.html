{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Splitwisely{% endblock %}</title><link rel="stylesheet" href="{% static 'trip/style.css' %}"></head><body><div class="shell"><header class="topbar"><a class="brand" href="{% url 'dashboard' %}?trip={{ trip.id }}"><span class="mark">▣</span> splitwisely</a>{% if user.is_authenticated %}<form class="trip-switcher" method="get" action="{% url 'dashboard' %}"><select name="trip" onchange="this.form.submit()">{% for option in trips %}<option value="{{ option.id }}" {% if option.id == trip.id %}selected{% endif %}>{{ option.name }}</option>{% endfor %}</select></form><a class="header-link" href="{% url 'new_trip' %}">＋ New trip</a>{% if trip %}<a class="header-link" href="{% url 'add_member' trip.id %}">＋ Invite</a>{% endif %}<span class="account-name">{{ user.username }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="logout">Log out</button></form>{% endif %}</header>{% block content %}{% endblock %}<footer><b>splitwisely</b><span>Made for the group chat that never sleeps.</span></footer></div></body></html>
